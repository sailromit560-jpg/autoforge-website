<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign up | AutoForge</title><link rel="stylesheet" href="css/styles.css"></head><body><div id="siteHeader"></div><main class="shell"><form class="form-card" id="signup"><h1>Your AutoForge account.</h1><label>Full name<input id="name" required></label><label>Email<input id="email" type="email" required></label><label>Phone<input id="phone" pattern="[0-9]{10}" required></label><label>Password<input id="password" type="password" minlength="8" required></label><label>Confirm password<input id="confirm" type="password" required></label><button class="button">CREATE ACCOUNT</button><div id="result"></div></form></main><div id="siteFooter"></div><script src="js/products.js"></script><script src="js/app.js"></script><script>shell();signup.onsubmit=e=>{e.preventDefault();if(password.value!==confirm.value){result.textContent='Passwords do not match.';return}let us=AF.get('af_users',[]);if(us.some(x=>x.email===email.value)){result.textContent='This email already has an account.';return}let u={name:name.value,email:email.value,phone:phone.value,password:password.value,admin:false};us.push(u);AF.set('af_users',us);AF.set('af_session',u);result.innerHTML=`<div class="demo-note"><b>Account created.</b><br>SMS preview → To: 9867243779: Welcome to AutoForge, ${u.name}.<br>Email preview → To: ${u.email}: Your AutoForge account is ready.</div>`};/* DEMO ONLY. Passwords are stored in plain text in localStorage for demonstration. A real deployment must hash passwords server-side and never store credentials in the browser. */ /* DEMO ONLY. No real SMS/email is sent from a static site. For real delivery, integrate an SMS API (e.g., MSG91, Twilio) and an email API (e.g., SendGrid, Resend) from a backend function — API keys must never be exposed in front-end code. */</script></body></html>
