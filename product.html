<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product | AutoForge</title><link rel="stylesheet" href="css/styles.css"></head><body><div id="siteHeader"></div><main class="shell"><div class="detail" id="detail"></div><section class="section"><h2>You may also like</h2><div class="products" id="related"></div></section></main><div id="siteFooter"></div><script src="js/products.js"></script><script src="js/app.js"></script><script>shell();let p=product(new URLSearchParams(location.search).get('id'))||products()[0];document.title=p.name+' | AutoForge';detail.innerHTML=`<div class="gallery">${image(p)}</div><div><small>${p.brand||'AUTOFORGE'} · ${p.type}</small><h1>${p.name}</h1><p>${p.desc}</p><div class="price">${AF.money(p.price)} ${p.mrp?`<del>${AF.money(p.mrp)}</del>`:''}</div><p class="stock">${p.stock>5?'In stock':'Only '+p.stock+' left — order soon'}</p><div class="qty"><button onclick="this.nextElementSibling.textContent=Math.max(1,+this.nextElementSibling.textContent-1)">−</button><b>1</b><button onclick="this.previousElementSibling.textContent=+this.previousElementSibling.textContent+1">+</button><button class="button" onclick="add('${p.id}')">ADD TO CART</button></div><h3>Specifications</h3><table class="specs">${p.spec.map(s=>`<tr><td>${s.split(' ')[0]}</td><td>${s}</td></tr>`).join('')}<tr><td>Fitment</td><td>${p.fitment||'Universal'}</td></tr></table><h3>What’s in the box</h3><p>${p.box}</p><h3>${p.category==='Care'?'How to use':'Compatibility / fitment'}</h3><p>${p.use||p.fitment+'. Please verify model year before installation.'}</p></div>`;related.innerHTML=products().filter(x=>x.category===p.category&&x.id!==p.id).slice(0,3).map(card).join('')</script></body></html>
