<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login | AutoForge</title><link rel="stylesheet" href="css/styles.css"></head><body><div id="siteHeader"></div><main class="shell"><form class="form-card" id="login"><h1>Welcome back.</h1><p>Demo customer: demo@autoforge.in / Demo@1234</p><label>Email or phone<input id="identity" required></label><label>Password<input id="password" type="password" required></label><button class="button">LOGIN</button><p>New here? <a href="signup.html">Create an account</a>.</p><div id="msg"></div></form></main><div id="siteFooter"></div><script src="js/products.js"></script><script src="js/app.js"></script><script>shell();login.onsubmit=e=>{e.preventDefault();let u=AF.get('af_users',[]).find(x=>(x.email===identity.value||x.phone===identity.value)&&x.password===password.value);if(!u){msg.textContent='Please check your details.';return}AF.set('af_session',u);location.href=u.admin?'admin/dashboard.html':'account.html'};/* DEMO ONLY. Passwords are stored in plain text in localStorage for demonstration. A real deployment must hash passwords server-side and never store credentials in the browser. */</script></body></html>
