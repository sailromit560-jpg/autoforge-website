<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Account | AutoForge</title><link rel="stylesheet" href="css/styles.css"></head><body><div id="siteHeader"></div><main class="shell section"><h1>My orders</h1><p id="welcome"></p><div id="orders"></div></main><div id="siteFooter"></div><script src="js/products.js"></script><script src="js/app.js"></script><script>shell();if(!user())location.href='login.html';welcome.textContent='Signed in as '+user().email;let steps=['Placed','Packed','Shipped','Out for Delivery','Delivered'];let os=AF.get('af_orders',[]).filter(o=>o.email===user().email);orders.innerHTML=os.length?os.map(o=>{let n=steps.indexOf(o.status);return `<article class="form-card"><b>${o.id}</b> · ${new Date(o.timestamp).toLocaleDateString('en-IN')}<h3>${AF.money(o.total)} · ${o.status}</h3><div class="status">${steps.map((s,i)=>`<span class="${i<=n?'done':''}">${s}</span>`).join('')}</div><p><b>Tracking:</b> ${o.tracking} · ${o.location}</p><ul>${o.checkpoints.map(x=>`<li>${x}</li>`).join('')}</ul></article>`}).join(''):'<p>No orders yet. Your next drive starts here.</p>'</script></body></html>
