<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | AutoForge</title><link rel="stylesheet" href="../css/styles.css"><script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script></head><body><div id="siteHeader"></div><main class="shell section"><h1>AutoForge control room</h1><div class="chart"><b>Page views — 30 days</b><svg viewBox="0 0 500 120"><polyline fill="none" stroke="#1469ff" stroke-width="4" points="0,95 60,70 115,78 175,38 235,62 295,25 355,45 415,15 500,35"/></svg><p>18,420 views · 3.8% conversion · Top product: 9H Ceramic Coat</p></div><section class="section"><h2>Stock management</h2><button class="button" onclick="exportTable('stock','stock.xlsx')">EXPORT TO EXCEL</button><div class="table-wrap"><table id="stock"><thead><tr><th>Product</th><th>Stock</th><th>Action</th></tr></thead><tbody></tbody></table></div></section><section><h2>Restock requests</h2><button class="button" onclick="exportTable('restocks','restocks.xlsx')">EXPORT TO EXCEL</button><div class="table-wrap"><table id="restocks"><thead><tr><th>Product</th><th>Requested at</th></tr></thead><tbody></tbody></table></div></section><section class="section"><h2>Customers</h2><button class="button" onclick="exportTable('customers','customers.xlsx')">EXPORT TO EXCEL</button><div class="table-wrap"><table id="customers"><thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Orders</th><th>Total spend</th></tr></thead><tbody></tbody></table></div></section><section><h2>Orders</h2><button class="button" onclick="exportTable('orderTable','orders.xlsx')">EXPORT TO EXCEL</button><div class="table-wrap"><table id="orderTable"><thead><tr><th>Order</th><th>Customer</th><th>Total</th><th>Status</th></tr></thead><tbody></tbody></table></div></section></main><div id="siteFooter"></div><script src="../js/products.js"></script><script src="../js/app.js"></script><script>shell();if(!user()||!user().admin)location.href='../login.html';let inventory=AF.get('af_stock',Object.fromEntries(products().map(p=>[p.id,p.stock]))),restock=AF.get('af_restock',[]);function draw(){document.querySelector('#stock tbody').innerHTML=products().map(p=>`<tr class="${inventory[p.id]<6?'low':''}"><td>${p.name}</td><td><input type="number" value="${inventory[p.id]}" onchange="updateStock('${p.id}',this.value)"></td><td>${inventory[p.id]<6?`<button onclick="reorder('${p.id}')">Reorder</button>`:'—'}</td></tr>`).join('');restocks.querySelector('tbody').innerHTML=restock.map(x=>`<tr><td>${x.name}</td><td>${x.at}</td></tr>`).join('');let us=AF.get('af_users',[]),os=AF.get('af_orders',[]);customers.querySelector('tbody').innerHTML=us.map(u=>{let x=os.filter(o=>o.email===u.email);return `<tr><td>${u.name}</td><td>${u.email}</td><td>${u.phone}</td><td>${x.length}</td><td>${AF.money(x.reduce((n,o)=>n+o.total,0))}</td></tr>`}).join('');orderTable.querySelector('tbody').innerHTML=os.map(o=>`<tr><td>${o.id}</td><td>${o.email}</td><td>${AF.money(o.total)}</td><td>${o.status}</td></tr>`).join('')}function updateStock(id,n){inventory[id]=+n;AF.set('af_stock',inventory);draw()}function reorder(id){restock.unshift({name:product(id).name,at:new Date().toLocaleString('en-IN')});AF.set('af_restock',restock);draw()}function exportTable(id,file){let wb=XLSX.utils.table_to_book(document.getElementById(id),{sheet:'AutoForge'});XLSX.writeFile(wb,file)}draw();/* DEMO ONLY. This dashboard reads/writes browser localStorage. A production admin panel needs a real backend, a proper database, and authenticated API access — this is not secure for real business data. */</script></body></html>
