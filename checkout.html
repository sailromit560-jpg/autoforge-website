<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout | AutoForge</title><link rel="stylesheet" href="css/styles.css"></head><body><div id="siteHeader"></div><main class="shell"><form class="form-card" id="checkout"><h1>Checkout</h1><p id="total"></p><label>Delivery address<input id="address" required placeholder="Full address, pincode"></label><div class="tabs"><button type="button" data-tab="upi" class="active">UPI</button><button type="button" data-tab="card">Card</button><button type="button" data-tab="bank">Net Banking</button></div><section class="payment-pane active" id="upi"><label>UPI ID<input placeholder="name@bank"></label><div class="demo-note">Demo QR code<br><b>▣ ▦ ▧ ▣ ▦</b><br>Use your UPI app in a real checkout.</div><button type="button" class="button" onclick="pay()">PAY VIA UPI APP</button></section><section class="payment-pane" id="card"><label>Card number<input id="cardNumber" inputmode="numeric" maxlength="19" placeholder="1234 5678 9012 3456"></label><label>Expiry<input id="expiry" maxlength="5" placeholder="MM/YY"></label><label>CVV<input id="cvv" inputmode="numeric" maxlength="3"></label><label>Name on card<input id="cardName"></label></section><section class="payment-pane" id="bank"><label>Select your bank<select><option>HDFC Bank</option><option>ICICI Bank</option><option>State Bank of India</option><option>Axis Bank</option><option>Kotak Mahindra Bank</option></select></label></section><button class="button" id="payNow">PAY NOW</button><div id="success"></div></form></main><div id="siteFooter"></div><script src="js/products.js"></script><script src="js/app.js"></script><script>shell();if(!user())location.href='login.html';let c=AF.get('af_cart',[]),sum=c.reduce((n,x)=>n+product(x.id).price*x.qty,0);total.textContent='Order total: '+AF.money(sum);document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button,.payment-pane').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelector('#'+b.dataset.tab).classList.add('active')});cardNumber.oninput=e=>e.target.value=e.target.value.replace(/\D/g,'').replace(/(.{4})/g,'$1 ').trim();expiry.oninput=e=>e.target.value=e.target.value.replace(/\D/g,'').replace(/(\d{2})(\d)/,'$1/$2');function pay(){let b=payNow;b.disabled=true;b.textContent='PROCESSING…';setTimeout(()=>{let o={id:AF.id(),tracking:'AF-IN-'+Date.now().toString().slice(-6),email:user().email,items:c,total:sum,address:address.value,timestamp:new Date().toISOString(),status:'Placed',location:'AutoForge Mumbai',checkpoints:['AutoForge Mumbai · Order placed']},os=AF.get('af_orders',[]);os.unshift(o);AF.set('af_orders',os);AF.set('af_cart',[]);success.innerHTML=`<div class="demo-note"><h3>Payment successful · ${o.id}</h3>SMS preview → To: 9867243779: Your AutoForge order ${o.id} is confirmed.<br>Email preview → To: ${user().email}: Your order is on its way.</div>`;b.remove();renderCart()},2000)}checkout.onsubmit=e=>{e.preventDefault();let active=document.querySelector('.payment-pane.active').id;if(active==='card'&&(!/^\d{16}$/.test(cardNumber.value.replaceAll(' ',''))||!/^\d{2}\/\d{2}$/.test(expiry.value)||!/^\d{3}$/.test(cvv.value)||!cardName.value)){alert('Please enter valid card details.');return}pay()};/* DEMO ONLY. For real payments, integrate Razorpay or Stripe Checkout here using their official SDK — do not send raw card details to any custom server. */ /* No real card data is stored anywhere. */ /* DEMO ONLY. No real SMS/email is sent from a static site. For real delivery, integrate an SMS API (e.g., MSG91, Twilio) and an email API (e.g., SendGrid, Resend) from a backend function — API keys must never be exposed in front-end code. */</script></body></html>
